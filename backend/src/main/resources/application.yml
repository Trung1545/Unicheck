spring:
  application:
    name: unicheck-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unicheck_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:unicheck_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:unicheck_secret_password}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

server:
  port: ${SERVER_PORT:${BACKEND_PORT:8080}}

# Security & Application Specific Configuration
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:${JWT_SECRET:}}
    expiration-ms: ${SECURITY_JWT_EXPIRATION:${JWT_EXPIRATION_MS:900000}}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  qr:
    secret: ${SECURITY_QR_SECRET:${SECURITY_JWT_SECRET:${JWT_SECRET:}}}
    rotation-seconds: ${QR_ROTATION_SECONDS:10}
    ttl-seconds: ${QR_TTL_SECONDS:15}
    clock-skew-seconds: ${QR_CLOCK_SKEW_SECONDS:2}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:5000}


# Testing & Development isolated modes (strictly disabled by default in production)
unicheck:
  testing:
    static-qr:
      enabled: ${STATIC_QR_ENABLED:true}
      allowed-class-name: ${STATIC_QR_ALLOWED_CLASS:SE1801-PRJ301,UNICHECK-E2E-01}
      ttl-minutes: ${STATIC_QR_TTL_MINUTES:30}
    wifi-simulation:
      enabled: ${WIFI_SIMULATION_ENABLED:true}
      allowed-class-name: ${WIFI_SIMULATION_ALLOWED_CLASS:SE1801-PRJ301,UNICHECK-E2E-01,PRJ301.01,PRJ301,*}
      simulated-ssid: ${WIFI_SIMULATION_SSID:AndroidWifi}
      simulated-bssid: ${WIFI_SIMULATION_BSSID:02:00:00:00:00:00}
