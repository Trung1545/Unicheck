  # =========================================================================
  # CANONICAL USER MANAGEMENT ENDPOINTS (/api/v1/users)
  # =========================================================================
  /api/v1/users:
    get:
      tags:
        - User Management (Canonical /api/v1/users)
      summary: List Users with Pagination and Filtering (Canonical)
      description: Requires ADMIN role. Supports keyword search across code, username, fullName, email.
      operationId: getAllUsersCanonical
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search keyword
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: "createdAt,desc"
      responses:
        '200':
          description: Lấy danh sách người dùng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageApiResponse'
        '403':
          description: Yêu cầu quyền ADMIN (ERR_2001)

    post:
      tags:
        - User Management (Canonical /api/v1/users)
      summary: Create New User (Canonical)
      description: Requires ADMIN role. Generates default password or sets initial status.
      operationId: createUserCanonical
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Tạo tài khoản người dùng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '400':
          description: Dữ liệu không hợp lệ hoặc đã tồn tại (ERR_1001 / ERR_2011)

  /api/v1/users/{id}:
    get:
      tags:
        - User Management (Canonical /api/v1/users)
      summary: Get User Details by ID (Canonical)
      description: Requires ADMIN role.
      operationId: getUserByIdCanonical
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lấy thông tin người dùng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '404':
          description: Không tìm thấy tài nguyên yêu cầu (ERR_1002)

    put:
      tags:
        - User Management (Canonical /api/v1/users)
      summary: Update User by ID (Canonical)
      description: Requires ADMIN role. Logs audit event.
      operationId: updateUserByIdCanonical
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Cập nhật thông tin người dùng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'

    delete:
      tags:
        - User Management (Canonical /api/v1/users)
      summary: Delete User by ID (Canonical)
      description: Requires ADMIN role.
      operationId: deleteUserByIdCanonical
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Xóa tài khoản người dùng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidApiResponse'

  /api/v1/users/active:
