        avatar:
          type: string
        isPasswordChanged:
          type: boolean
        createdAt:
          type: string
          format: date-time
        studentCourse:
          type: string
        gpa:
          type: number
          format: double
        majorId:
          type: integer
          format: int64
        specializationId:
          type: integer
          format: int64
        subSpecializationId:
          type: integer
          format: int64
        department:
          type: string
        expertise:
          type: string
        bio:
          type: string
        permissions:
          type: array
          items:
            type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        dob:
          type: string
          format: date
        sex:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        faceDataStatus:
          $ref: '#/components/schemas/FaceDataStatus'
        avatar:
          type: string
        isPasswordChanged:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        studentCourse:
          type: string
        gpa:
          type: number
          format: double
        majorId:
          type: integer
          format: int64
        specializationId:
          type: integer
          format: int64
        subSpecializationId:
          type: integer
          format: int64
        department:
          type: string
        expertise:
          type: string
        bio:
          type: string
        permissions:
          type: array
          items:
            type: string

    # -----------------------------------------------------------------------
