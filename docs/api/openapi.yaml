openapi: 3.0.3
info:
  title: UniCheck Authentication & User Management API
  description: |
    Official frozen API contract for UniCheck Smart Attendance System.
    This contract serves as the Single Source of Truth (SSOT) for the Flutter mobile client (`mobile/`),
    desktop/web Flutter builds, and third-party integrations.

    ### Routing Policy:
    - **Canonical Route Prefix:** `/api/v1/...` (Target standard for all new Flutter clients)
    - **Backward-Compatible Alias:** `/api/...` (Legacy dual-mapped endpoints, guaranteed identical behavior)

    ### Authentication Architecture:
    - JWT Access Token: Stateless HS256, lifetime 15 minutes (900s), bearer in `Authorization: Bearer <token>`.
    - Refresh Token: Tracked in Redis/fallback cache, lifetime 7 days (604,800s), rotatable with reuse detection.
    - Flat Login Response: `LoginResponse` returns user claims directly at root of `data`. It does NOT nest within `data.user`.
  version: 1.0.0
  contact:
    name: UniCheck Engineering Team
    email: dev@unicheck.edu.vn

servers:
  - url: http://localhost:8080
    description: Local Spring Boot Development Server
  - url: https://api.unicheck.edu.vn
    description: Production Environment (Future Staging/Prod)

tags:
  - name: Authentication (Canonical /api/v1/auth)
    description: Canonical user login, logout, refresh token, and self-service profile management
  - name: Authentication (Legacy Alias /api/auth)
    description: Dual-mapped alias endpoints preserved for backward compatibility
  - name: User Management (Canonical /api/v1/users)
    description: Administrator user CRUD, status filtering, and pagination
  - name: User Management (Legacy Alias /api/users)
    description: Dual-mapped alias endpoints for user management
  - name: Facility Management (Canonical /api/v1/facilities)
    description: Classrooms, Wi-Fi Access Points, and Room-Wi-Fi associations (F-13)
  - name: Timetable Management (Canonical /api/v1/timetable)
    description: Class schedule slots, conflict checking, slot types, and personal timetables (F-16)
  - name: AI Face Recognition (Canonical /api/v1/face)
    description: ArcFace feature extraction, face detection, identity verification, and liveness contracts (F-18, F-19, F-20)

paths:
  # =========================================================================
  # CANONICAL AUTHENTICATION ENDPOINTS (/api/v1/auth)
  # =========================================================================
  /api/v1/auth/login:
    post:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: User Login (Canonical)
      description: |
        Authenticates a user via username and password. On success, issues a flat `LoginResponse`
        containing an Access Token (15m) and a Refresh Token (7d).
        Subject to rate limiting: maximum 5 consecutive failed attempts per username within 15 minutes.
      operationId: loginCanonical
      parameters:
        - name: X-Device-Id
          in: header
          required: false
          description: Client device unique identifier for multi-device session tracking
          schema:
            type: string
            example: "pixel7-android-uuid-12345"
        - name: User-Agent
          in: header
          required: false
          description: Client platform User-Agent string
          schema:
            type: string
            example: "UniCheck-Flutter/1.0.0 (Android 14; Pixel 7)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApiResponse'
              example:
                success: true
                data:
                  token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzdHVkZW50XzAxIiwiZXhwIjoxNzg5MDAwMDB9..."
                  refreshToken: "6b2a0c4f-9e7d-41a2-8e1f-d748f2a1b9c3"
                  tokenType: "Bearer"
                  expiresIn: 900
                  userId: 101
                  code: "SV20260001"
                  username: "student_01"
                  fullName: "Nguyễn Văn Sinh Viên"
                  email: "student01@unicheck.edu.vn"
                  role: "STUDENT"
                  isPasswordChanged: true
                message: "Đăng nhập thành công"
                errorCode: null
        '400':
          description: Dữ liệu gửi lên không hợp lệ (ERR_1001)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data:
                  username: "Tên đăng nhập không được để trống"
                message: "Dữ liệu gửi lên không hợp lệ"
                errorCode: "ERR_1001"
        '401':
          description: Tên đăng nhập hoặc mật khẩu không chính xác (ERR_2002)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                message: "Tên đăng nhập hoặc mật khẩu không chính xác"
                errorCode: "ERR_2002"
        '429':
          description: Vượt quá số lần thử đăng nhập (ERR_2007)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
              example:
                success: false
                data: null
                message: "Quá nhiều lần thử đăng nhập thất bại. Vui lòng thử lại sau 15 phút"
                errorCode: "ERR_2007"

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: User Logout (Canonical)
      description: |
        Revokes the current access token and session in Redis / fallback cache.
        Does NOT invalidate sessions on other devices unless explicitly required.
      operationId: logoutCanonical
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidApiResponse'
              example:
                success: true
                data: null
                message: "Đăng xuất thành công"
                errorCode: null

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Refresh Access Token (Canonical)
      description: |
        Exchanges a valid Refresh Token for a new Access Token.
        Enforces Refresh Token Rotation (RTR): once used, the old refresh token is revoked
        and replaced with a newly issued refresh token. Reuse detection immediately revokes all family sessions.
      operationId: refreshTokenCanonical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Làm mới mã xác thực thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshApiResponse'
              example:
                success: true
                data:
                  token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJzdHVkZW50XzAxIiwiZXhwIjoxNzg5ODY0MDB9..."
                  refreshToken: "a1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
                  tokenType: "Bearer"
                  expiresIn: 900
                message: "Làm mới mã xác thực thành công"
                errorCode: null
        '401':
          description: Mã xác thực không hợp lệ hoặc đã bị thu hồi (ERR_2006 / ERR_2010)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Get Current User Profile (Canonical /me)
      description: |
        Retrieves full profile details of the authenticated caller.
        Rejects Refresh Tokens with 401 Unauthorized (`type=access` required).
      operationId: getCurrentUserProfileCanonical
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
        '401':
          description: Chưa xác thực hoặc token hết hạn (ERR_2000 / ERR_2005)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/auth/profile:
    get:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Get Current User Profile (Canonical /profile)
      description: Alias path to `/api/v1/auth/me`. Returns identical payload.
      operationId: getProfileCanonical
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'
    put:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Update Current User Profile (Canonical)
      description: Updates basic demographic info (fullName, phone, dob, sex, avatar) for the authenticated user.
      operationId: updateProfileCanonical
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileApiResponse'

  /api/v1/auth/change-password:
    post:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Change Password (Canonical)
      description: Allows authenticated user to update password upon supplying correct old password.
      operationId: changePasswordCanonical
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidApiResponse'
        '400':
          description: Mật khẩu hiện tại không chính xác (ERR_2009)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Request Password Reset OTP (Canonical)
      description: |
        Generates a 6-digit OTP sent via email (masked in server logs as `[******]`).
        Always returns generic 200 message to prevent user enumeration attacks.
      operationId: forgotPasswordCanonical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic confirmation message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidApiResponse'
              example:
                success: true
                data: null
                message: "Nếu email tồn tại trong hệ thống, mã xác thực 6 chữ số đã được gửi qua email"
                errorCode: null

  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Reset Password with OTP (Canonical)
      description: Verifies 6-digit OTP and applies the new password.
      operationId: resetPasswordCanonical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidApiResponse'
        '400':
          description: Mã xác thực không chính xác hoặc đã hết hạn (ERR_2008)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/auth/test/admin:
    get:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Verify ADMIN Role Access (Canonical)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Quyền truy cập hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringApiResponse'
        '403':
          description: Quyền hạn không hợp lệ (ERR_2001)

  /api/v1/auth/test/lecturer:
    get:
      tags:
        - Authentication (Canonical /api/v1/auth)
      summary: Verify LECTURER Role Access (Canonical)
      security:
