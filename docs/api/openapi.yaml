  # =========================================================================
  # AI MICROSERVICE ENDPOINTS (/api/v1/face & /health)
  # =========================================================================
  /health:
    get:
      tags:
        - AI Face Recognition (Canonical /api/v1/face)
      summary: Kiểm tra trạng thái AI Microservice và sự sẵn sàng của mô hình ArcFace & YuNet
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "UP"
                      service:
                        type: string
                        example: "UniCheck AI Microservice"
                      version:
                        type: string
                        example: "1.0.0"
                      model_ready:
                        type: boolean
                        example: true
                      detector_ready:
                        type: boolean
                        example: true
                      model_name:
                        type: string
                        example: "ArcFace-MobileFaceNet"
                      model_version:
                        type: string
                        example: "w600k_mbf_v1"
                      embedding_dimension:
                        type: integer
                        example: 512
                      detector_name:
                        type: string
                        example: "YuNet-2023mar"
                  message:
                    type: string
                    example: "AI Service is healthy and models are ready"
                  errorCode:
                    type: string
                    nullable: true
                    example: null

  /api/v1/face/extract-embedding:
    post:
      tags:
        - AI Face Recognition (Canonical /api/v1/face)
      summary: Trích xuất vector đặc trưng khuôn mặt 512 chiều chuẩn hóa L2 từ ảnh Base64
      description: |
        Thực hiện pipeline 5 bước: Giải mã Base64 -> Phát hiện khuôn mặt YuNet (yêu cầu duy nhất 1 mặt) ->
        Căn chỉnh Affine 5 điểm mốc chuẩn 112x112 -> Trích xuất đặc trưng ArcFace MobileFaceNet ONNX ->
        Chuẩn hóa L2 về mặt cầu đơn vị.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_base64
              properties:
                image_base64:
                  type: string
                  description: Chuỗi ảnh mã hóa Base64 (hỗ trợ kèm Data URL prefix)
      responses:
        '200':
          description: Trích xuất đặc trưng khuôn mặt thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      embedding:
                        type: array
                        items:
                          type: number
                          format: float
                        description: Vector đặc trưng 512 phần tử chuẩn hóa L2
                      embedding_dimension:
                        type: integer
                        example: 512
                      model_name:
                        type: string
                        example: "ArcFace-MobileFaceNet"
                      model_version:
                        type: string
                        example: "w600k_mbf_v1"
                      face_detected:
                        type: boolean
                        example: true
                      confidence:
                        type: number
                        format: float
                        example: 0.9854
                      bounding_box:
                        type: object
                        properties:
                          x:
                            type: integer
                          y:
                            type: integer
                          width:
                            type: integer
                          height:
                            type: integer
                      quality:
                        type: object
                        properties:
                          face_width:
                            type: integer
                          face_height:
                            type: integer
                  message:
                    type: string
                    example: "Trích xuất đặc trưng khuôn mặt thành công"
                  errorCode:
                    type: string
                    nullable: true
                    example: null
        '400':
          description: Không tìm thấy mặt (ERR_3001), nhiều hơn 1 mặt (ERR_3002) hoặc ảnh hỏng (ERR_1001)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/face/verify-face:
    post:
      tags:
        - AI Face Recognition (Canonical /api/v1/face)
      summary: So khớp danh tính khuôn mặt bằng Cosine Similarity
      description: |
        Chấp nhận hai vector đặc trưng 512 chiều hoặc hai ảnh Base64 để trích xuất và đối sánh trực tiếp.
        Độ tương đồng Cosine được so sánh với ngưỡng quyết định threshold (mặc định 0.68).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_embedding:
                  type: array
                  items:
                    type: number
                    format: float
                target_embedding:
                  type: array
                  items:
                    type: number
                    format: float
                source_image_base64:
                  type: string
                target_image_base64:
                  type: string
                threshold:
                  type: number
                  format: float
                  default: 0.68
                  example: 0.68
                metric:
                  type: string
                  enum: [cosine, euclidean]
                  default: cosine
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      matched:
                        type: boolean
                        example: true
                      similarity_score:
                        type: number
                        format: float
                        example: 0.8842
                      threshold:
                        type: number
                        format: float
                        example: 0.68
                      metric:
                        type: string
                        example: "cosine"
                      euclidean_distance:
                        type: number
                        format: float
                        example: 0.4812
                      model_name:
                        type: string
                        example: "ArcFace-MobileFaceNet"
                      model_version:
                        type: string
                        example: "w600k_mbf_v1"
                  message:
                    type: string
                    example: "Xác thực so khớp khuôn mặt thành công"
                  errorCode:
                    type: string
                    nullable: true
                    example: null

  /api/v1/face/check-liveness:
    post:
      tags:
        - AI Face Recognition (Canonical /api/v1/face)
      summary: Kiểm tra thực thể sống chống giả mạo khuôn mặt (Fail-Closed Contract)
      description: |
        Cơ chế Fail-Closed: Tính năng kiểm tra thực thể (Liveness Anti-Spoofing) chưa triển khai model MiniFASNet
        trong TASK-03 (dự kiến TASK-07). Endpoint từ chối với HTTP 501 UNAVAILABLE để ngăn chặn bypass gian lận.
      responses:
        '501':
          description: Anti-spoofing engine chưa được kích hoạt (Fail-Closed an toàn)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                    properties:
                      is_live:
                        type: boolean
                        example: false
                      status:
                        type: string
                        example: "UNAVAILABLE"
                      reason:
                        type: string
                        example: "Liveness Anti-Spoofing engine is in development (Scheduled for TASK-07)"
                      fail_closed:
                        type: boolean
                        example: true
                  message:
                    type: string
                    example: "Tính năng kiểm tra thực thể sống (Liveness Anti-Spoofing) chưa được kích hoạt trong phiên bản này"
                  errorCode:
                    type: string
                    example: "ERR_3003"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticate by prefixing the JWT access token with "Bearer " in the Authorization header.

  schemas:
    # -----------------------------------------------------------------------
    # ENUMS
    # -----------------------------------------------------------------------
    Role:
      type: string
      enum:
        - ADMIN
        - LECTURER
        - STUDENT
      example: STUDENT

    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - BLOCKED
      example: ACTIVE

    FaceDataStatus:
      type: string
      enum:
        - NOT_REGISTERED
        - ACTIVE
        - BLOCKED
      example: ACTIVE

    ErrorCode:
      type: string
      enum:
        # System (1000-1099)
        - ERR_1000 # Lỗi hệ thống máy chủ nội bộ
        - ERR_1001 # Dữ liệu yêu cầu không hợp lệ
        - ERR_1002 # Không tìm thấy tài nguyên yêu cầu
        - ERR_1003 # Phương thức HTTP không được hỗ trợ
        # Auth & Security (2000-2099)
        - ERR_2000 # Yêu cầu đăng nhập hoặc phiên làm việc đã hết hạn
        - ERR_2001 # Bạn không có quyền truy cập chức năng này
        - ERR_2002 # Tên đăng nhập hoặc mật khẩu không chính xác
        - ERR_2003 # Tài khoản hiện đang bị khóa
        - ERR_2004 # Tài khoản chưa được kích hoạt
        - ERR_2005 # Mã xác thực JWT đã hết hạn
        - ERR_2006 # Mã xác thực JWT không hợp lệ
        - ERR_2007 # Quá nhiều lần thử đăng nhập thất bại. Vui lòng thử lại sau 15 phút
        - ERR_2008 # Mã xác thực không chính xác hoặc đã hết hạn
        - ERR_2009 # Mật khẩu hiện tại không chính xác
        - ERR_2010 # Phiên đăng nhập đã bị thu hồi
        - ERR_2011 # Tên đăng nhập, email hoặc mã định danh đã tồn tại trong hệ thống
        # Face & Attendance (3000-3099)
        - ERR_3001 # Không phát hiện khuôn mặt trong ảnh
        - ERR_3002 # Phát hiện nhiều hơn một khuôn mặt
        - ERR_3003 # Kiểm tra thực thể (liveness) thất bại
        - ERR_3004 # Khuôn mặt không khớp với hồ sơ đã đăng ký
        - ERR_3005 # Sinh viên chưa đăng ký dữ liệu khuôn mặt
        - ERR_3006 # Ca điểm danh đã kết thúc hoặc chưa mở
        - ERR_3007 # Bạn đã điểm danh thành công cho ca học này
        - ERR_3008 # Vị trí Wi-Fi không khớp với phòng học quy định
        # Academic (4000-4099)
        - ERR_4001 # Dữ liệu đã tồn tại trong hệ thống
        - ERR_4002 # Lớp học đã đạt số lượng tối đa
        # Facilities & Wi-Fi Access Points (5000-5099)
        - ERR_5001 # Không tìm thấy phòng học
        - ERR_5002 # Mã phòng học đã tồn tại
        - ERR_5003 # Địa chỉ BSSID của Wi-Fi AP đã tồn tại
        - ERR_5004 # Wi-Fi Access Point đã được gán vào phòng học này
        - ERR_5005 # Không tìm thấy liên kết giữa phòng học và Wi-Fi AP
        - ERR_5006 # Không tìm thấy Wi-Fi Access Point
        - ERR_5007 # Không thể xóa phòng học đang được sử dụng trong lịch học hoặc ca điểm danh
        - ERR_5008 # Không thể xóa Wi-Fi Access Point đang được liên kết với phòng học
        # Timetable & Scheduling (6000-6099)
        - ERR_6001 # Không tìm thấy ca học
        - ERR_6002 # Không tìm thấy loại tiết học
        - ERR_6003 # Trùng phòng học: Phòng đã được xếp lịch cho lớp khác trong cùng ca học
        - ERR_6004 # Trùng lịch giảng viên: Giảng viên đã có lịch giảng dạy trong cùng ca học
        - ERR_6005 # Trùng lịch lớp học: Lớp học phần đã có lịch học trong cùng ca học
        - ERR_6006 # Ngày học không thuộc khoảng thời gian của học kỳ
        - ERR_6007 # Ngày học trùng với ngày nghỉ lễ theo lịch của trường
        - ERR_6008 # Phòng học đang bảo trì hoặc không khả dụng
        - ERR_6009 # Sức chứa của phòng học nhỏ hơn sĩ số của lớp
        - ERR_6010 # Không thể thay đổi hoặc xóa lịch học đã có phiên điểm danh
        - ERR_6011 # Số tiết học hoặc khoảng ca học không hợp lệ

    RoomType:
      type: string
      enum:
        - THEORY
        - LAB
        - AUDITORIUM
        - MEETING
        - OTHER
      example: THEORY

    RoomStatus:
      type: string
      enum:
        - AVAILABLE
        - OCCUPIED
        - MAINTENANCE
        - INACTIVE
      example: AVAILABLE

    WifiApStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - MAINTENANCE
      example: ACTIVE

    TimetableSlotStatus:
      type: string
      enum:
        - SCHEDULED
        - COMPLETED
        - CANCELLED
        - RESCHEDULED
      example: SCHEDULED

    # -----------------------------------------------------------------------
    # REQUEST MODELS
    # -----------------------------------------------------------------------
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "student_01"
          description: Tên đăng nhập
        password:
          type: string
          format: password
          example: "Student@123"
          description: Mật khẩu người dùng

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "6b2a0c4f-9e7d-41a2-8e1f-d748f2a1b9c3"
          description: Refresh token đã cấp trước đó

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
          example: "OldPassword123"
        newPassword:
          type: string
          format: password
          minLength: 6
          example: "NewPassword456"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "student01@unicheck.edu.vn"

    ResetPasswordRequest:
      type: object
      required:
        - email
        - otp
        - newPassword
      properties:
        email:
          type: string
          format: email
          example: "student01@unicheck.edu.vn"
        otp:
          type: string
          example: "123456"
          description: 6-digit numeric verification OTP
        newPassword:
          type: string
          format: password
          minLength: 6
          example: "NewSecretPassword789"

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "Nguyễn Văn Sinh Viên"
        phone:
          type: string
          example: "0901234567"
        dob:
          type: string
          format: date
          example: "2003-05-15"
        sex:
          type: string
          example: "NAM"
        avatar:
          type: string
          example: "https://storage.unicheck.edu.vn/avatars/user_101.jpg"

    UserCreateRequest:
      type: object
      required:
        - username
        - fullName
        - email
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "student_new"
        fullName:
          type: string
          maxLength: 150
          example: "Trần Minh Quang"
        email:
          type: string
          format: email
          example: "quangtm@unicheck.edu.vn"
        code:
          type: string
          maxLength: 50
          example: "SV20260099"
        role:
          $ref: '#/components/schemas/Role'
          default: STUDENT
        status:
          $ref: '#/components/schemas/UserStatus'
          default: INACTIVE
        phone:
          type: string
          example: "0912345678"
        dob:
          type: string
          format: date
          example: "2004-01-20"
        sex:
          type: string
          example: "NAM"
        avatar:
          type: string
        password:
          type: string
          format: password
          description: Initial password. If omitted, default initial password is applied.
        studentCourse:
          type: string
          example: "K18"
        majorId:
          type: integer
          format: int64
        specializationId:
          type: integer
          format: int64
        subSpecializationId:
          type: integer
          format: int64
        department:
          type: string
          example: "Công nghệ thông tin"
        expertise:
          type: string
          example: "Trí tuệ nhân tạo"

    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        code:
          type: string
          maxLength: 50
        phone:
          type: string
        dob:
          type: string
          format: date
        sex:
          type: string
        avatar:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        studentCourse:
          type: string
        majorId:
          type: integer
          format: int64
        specializationId:
          type: integer
          format: int64
        subSpecializationId:
          type: integer
          format: int64
        department:
          type: string
        expertise:
          type: string
        bio:
          type: string

    # -----------------------------------------------------------------------
    # RESPONSE DATA MODELS
    # -----------------------------------------------------------------------
    LoginResponse:
      type: object
      description: |
        Flat authentication payload. All identity and credential claims reside
        directly at root level of `data`. Do NOT parse as `data.user`.
      properties:
        token:
          type: string
          description: JWT Access Token (stateless, 24h validity)
          example: "eyJhbGciOiJIUzI1NiJ9..."
        refreshToken:
          type: string
          description: Refresh Token (UUID or opaque token)
          example: "6b2a0c4f-9e7d-41a2-8e1f-d748f2a1b9c3"
        tokenType:
          type: string
          default: "Bearer"
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds (900s for 15 mins)
          example: 900
        userId:
          type: integer
          format: int64
          example: 101
        code:
          type: string
          example: "SV20260001"
        username:
          type: string
          example: "student_01"
        fullName:
          type: string
          example: "Nguyễn Văn Sinh Viên"
        email:
          type: string
          example: "student01@unicheck.edu.vn"
        role:
          $ref: '#/components/schemas/Role'
        isPasswordChanged:
          type: boolean
          example: true

    TokenRefreshResponse:
      type: object
      properties:
        token:
          type: string
          description: Newly issued Access Token
          example: "eyJhbGciOiJIUzI1NiJ9..."
        refreshToken:
          type: string
          description: Newly issued or retained Refresh Token under RTR policy
          example: "a1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
        tokenType:
          type: string
          default: "Bearer"
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds (900s for 15 mins)
          example: 900

    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        dob:
          type: string
          format: date
        phone:
          type: string
        sex:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        faceDataStatus:
