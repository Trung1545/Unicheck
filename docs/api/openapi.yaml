    # -----------------------------------------------------------------------
    # FACILITY REQUEST & RESPONSE MODELS (TASK-02C - F-13)
    # -----------------------------------------------------------------------
    RoomCreateRequest:
      type: object
      required:
        - code
        - name
        - capacity
      properties:
        code:
          type: string
          maxLength: 20
          example: "A201"
        name:
          type: string
          maxLength: 100
          example: "Phòng học Lý thuyết A201"
        capacity:
          type: integer
          minimum: 1
          example: 60
        building:
          type: string
          maxLength: 50
          example: "Tòa Nhà A"
        description:
          type: string
          maxLength: 500
          example: "Phòng học trang bị máy chiếu và điều hòa"
        floor:
          type: integer
          example: 2
        type:
          $ref: '#/components/schemas/RoomType'
        status:
          $ref: '#/components/schemas/RoomStatus'

    RoomUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: "Phòng học Lý thuyết A201 (Nâng cấp)"
        capacity:
          type: integer
          minimum: 1
          example: 70
        building:
          type: string
          maxLength: 50
          example: "Tòa Nhà A"
        description:
          type: string
          maxLength: 500
        floor:
          type: integer
          example: 2
        type:
          $ref: '#/components/schemas/RoomType'
        status:
          $ref: '#/components/schemas/RoomStatus'

    WifiAccessPointCreateRequest:
      type: object
      required:
        - ssid
        - bssid
      properties:
        ssid:
          type: string
          maxLength: 100
          example: "UniCheck_A201_5G"
        bssid:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
          example: "00:1A:2B:3C:4D:5E"
        name:
          type: string
          maxLength: 100
          example: "AP-Cisco-A201"
        location:
          type: string
          maxLength: 200
          example: "Trần nhà trung tâm phòng A201"
        status:
          $ref: '#/components/schemas/WifiApStatus'

    WifiAccessPointUpdateRequest:
      type: object
      properties:
        ssid:
          type: string
          maxLength: 100
        bssid:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
        name:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/WifiApStatus'

    AssignWifiApRequest:
      type: object
      required:
        - wifiAccessPointId
      properties:
        wifiAccessPointId:
          type: integer
          format: int64
          example: 1
        isPrimary:
          type: boolean
          default: false
          example: true

    RoomResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: "A201"
        name:
          type: string
          example: "Phòng học Lý thuyết A201"
        capacity:
          type: integer
          example: 60
        building:
          type: string
          example: "Tòa Nhà A"
        description:
          type: string
        floor:
          type: integer
          example: 2
        type:
          $ref: '#/components/schemas/RoomType'
        status:
          $ref: '#/components/schemas/RoomStatus'
        wifiAccessPointsCount:
